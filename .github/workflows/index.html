<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TH Chamber</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f6b4f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#1d2b24;--mut:#6b7a72;--ac:#1f6b4f;--acs:#dcefe5;--bad:#b3362b;--bd:#d9e1db;--fs:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--ink:#e6efe9;--mut:#93a49a;--ac:#5cc79b;--acs:#25382f;--bad:#ff8a7a;--bd:#2c3a32}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b2620;--ink:#e6efe9;--mut:#93a49a;--ac:#5cc79b;--acs:#25382f;--bad:#ff8a7a;--bd:#2c3a32}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.5 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);position:relative}
header h1{flex:1;margin:0;font-size:1.2em;font-weight:700}
button{font:inherit;color:inherit;background:var(--acs);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--bg)}
button.x{background:none;color:var(--bad)}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
#menu{position:absolute;right:10px;top:52px;background:var(--card);border:1px solid var(--bd);border-radius:12px;display:none;z-index:20;min-width:190px;overflow:hidden}
#menu button{display:block;width:100%;text-align:left;border-radius:0;background:none;padding:12px 14px}
main{flex:1;overflow:auto;padding:12px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chips button{white-space:nowrap}
.chips button.on{background:var(--ac);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;margin-bottom:9px}
.card b{display:block}
.r{display:flex;gap:8px;align-items:center}
.r>*{flex:1}.r>.s{flex:none}
.m{color:var(--mut);font-size:.88em}
.out{color:var(--bad);font-weight:600}.low{color:#b7791f;font-weight:600}#pop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end}#pop>div{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px}
nav{display:flex;border-top:1px solid var(--bd);padding:6px 10px;gap:8px;background:var(--card)}
nav button{flex:1;background:none;padding:10px}
nav button.plus{flex:none;width:56px;background:var(--ac);color:var(--bg);font-size:1.5em;border-radius:50%;padding:0;height:56px;margin-top:-18px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30;align-items:flex-end}
#sheet>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.lbl{margin:10px 0 4px;color:var(--mut);font-size:.9em}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:var(--bg)}
</style>
</head>
<body>
<header><button id="back" onclick="go('home')" style="display:none">←</button><h1 onclick="go('home')" id="ttl">TH Chamber</h1><button onclick="stock()">স্টক চেক</button><button onclick="tm()">⋮</button>
<div id="menu"></div></header>
<main id="v"></main><datalist id="cl"></datalist><div id="pop" onclick="if(event.target==this)popX()"></div>
<nav><button onclick="catPick()">☰ ক্যাটাগরি</button><button onclick="srch()">🔍 সার্চ</button><button class="plus" onclick="plus()">+</button></nav>
<div id="sheet" onclick="if(event.target==this)closeS()"><div id="sb"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DEF={cats:['পোটেন্সি','মাদার টিংচার','বায়োকেমিক','৫০ সহস্রতমিক','পেটেন্ট','অন্যান্য'],items:[],orders:[],debt:[],recv:[],drafts:[],set:{theme:'auto',fs:16,color:''}};
let D;try{D=JSON.parse(localStorage.getItem('ms1'))||DEF}catch(e){D=DEF}
const sv=()=>{try{localStorage.setItem('ms1',JSON.stringify(D))}catch(e){}};
let view='home',cat=D.cats[0],tab='debt',sel=new Set(),S=null,A=null,lastPot='30';
const POTS=['Q','6X','12X','3','6','30','200','1M','10M','50M','CM'];

function applySet0(){const s=D.set,r=document.documentElement;r.style.setProperty('--fs',s.fs+'px');
 if(s.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',s.theme);
 s.color?r.style.setProperty('--ink',s.color):r.style.removeProperty('--ink')}
function go(v){view=v;$('#menu').style.display='none';render()}
function tm(){const m=$('#menu');m.innerHTML=`<button onclick="go('orders')">অর্ডার লিস্ট</button><button onclick="go('acct')">টাকার হিসাব</button><button onclick="drafts()">ড্রাফট (${D.drafts.length})</button><button onclick="go('set')">সেটিং</button>`;m.style.display=m.style.display=='block'?'none':'block'}
function plus(){view=='acct'?openAcct(null):openItem(null)}

function render(){applySet();$('#back').style.display=view=='home'?'none':'';
 const T={home:'TH Chamber',orders:'অর্ডার লিস্ট',acct:'টাকার হিসাব',set:'সেটিং',stock:'স্টক চেক'};$('#ttl').textContent=T[view];
 $('#cl').innerHTML=(D.companies||[]).map(c=>`<option value="${esc(c)}">`).join('');
 $('#v').innerHTML=({home:vHome,orders:vOrders,acct:vAcct,set:vSet,stock:vStock})[view]()}
function setCo(id,v){D.orders.find(x=>x.id==id).company=v;v=v.trim();D.companies=D.companies||[];if(v&&!D.companies.includes(v))D.companies.push(v);sv();render()}
function done0(id){const o=D.orders.find(x=>x.id==id);const n=prompt('কতটা এসেছে? (স্টকে যোগ হবে, না চাইলে ০)','1');if(n===null)return;const it=D.items.find(x=>x.id==o.iid);const r=it&&(it.rows.find(x=>x.p==o.p&&x.loc==o.loc)||it.rows.find(x=>x.p==o.p));if(r)r.q+=(+n||0);D.orders=D.orders.filter(x=>x.id!=id);sv();render()}
function dl(a,p){if(!a.deadline||a.total-p<=0)return '';const d=Math.ceil((new Date(a.deadline)-new Date(new Date().toDateString()))/864e5);return d<0?' ⚠ মেয়াদ পেরিয়েছে':d<=3?' ⚠ '+d+' দিন বাকি':''}
function dupSug0(){const q=S.name.trim().toLowerCase(),b=$('#dup');if(!b)return;if(!q){b.innerHTML='';return}
 const L=D.items.filter(i=>i.id!=S.id&&(i.name+' '+(i.alias||'')).toLowerCase().includes(q)).slice(0,4);
 b.innerHTML=L.length?'<div class="m" style="margin-top:6px">আগে থেকে আছে, খুলতে ট্যাপ করুন:</div>'+L.map(i=>`<button style="margin:4px 4px 0 0" onclick="openItem('${i.id}')">${esc(i.name)}</button>`).join(''):''}
let lpT,lpAt=0;
const pk=s=>({name:s.name,cat:s.cat,alias:s.alias||'',min:s.min||0,rows:s.rows,notes:s.notes||[]});
function lpA0(id,n){return `onpointerdown="lpS(event,'${id}',${n})" onpointerup="lpE()" onpointercancel="lpE()" onpointerleave="lpE()" oncontextmenu="return false"`}
function lpS0(e,id,n){e.stopPropagation();clearTimeout(lpT);lpT=setTimeout(()=>{lpAt=Date.now();ordAdd(id,n);lpAt=Date.now()},550)}
function lpE(){clearTimeout(lpT)}
function ordAdd0(id,n){const i=D.items.find(x=>x.id==id),r=i.rows[n],x={iid:id,name:i.name,p:r.p,loc:r.loc,q:r.q};
 if(inOrd(x))return alert('আগে থেকেই অর্ডার তালিকায় আছে');
 if(confirm(i.name+' — '+r.p+'\nঅর্ডার তালিকায় যোগ করবেন?')){D.orders.push({id:uid(),...x,company:''});sv();alert('অর্ডার তালিকায় যোগ হয়েছে')}}
function pw(i){if(D.set.bd===false)return '';return i.rows.map((r,n)=>r.q<=0?`<span class="out" style="margin-right:12px" ${lpA(i.id,n)}>${esc(r.p)} শেষ</span>`:r.q<=(i.min||0)?`<span class="low" style="margin-right:12px" ${lpA(i.id,n)}>${esc(r.p)} কম</span>`:'').join('')}
function drawView0(id){const i=D.items.find(x=>x.id==id);if(!i)return;
 openS(`<div class="r"><b>${esc(i.name)}</b><button class="s" onclick="editIt('${id}')">✎ সম্পাদনা</button><button class="s" onclick="closeS()">✕</button></div>${i.alias?`<div class="m">${esc(i.alias)}</div>`:''}<div class="m">ক্যাটাগরি: ${esc(i.cat)} · সর্বনিম্ন সীমা: ${i.min||0}</div>
<div class="card" style="margin-top:10px;padding:0"><div class="r m" style="padding:8px 12px"><span>পাওয়ার</span><span>কোথায়</span><span class="s" style="min-width:60px">কতটুকু</span></div>${i.rows.map((r,n)=>`<div class="r ${rc(i,r)}" style="padding:10px 12px;border-top:1px solid var(--bd);user-select:none" ${lpA(id,n)}><span>${esc(r.p)}</span><span>${esc(r.loc)||'—'}</span><span class="s" style="min-width:60px">${r.q}</span></div>`).join('')}</div>
<p class="m">পাওয়ারে চেপে ধরলে অর্ডার তালিকায় যোগ করার অপশন আসবে।</p>`)}
function editIt(id){const it=D.items.find(x=>x.id==id);S=JSON.parse(JSON.stringify(it));S.draftId=null;S.saved=false;S.orig=JSON.stringify(pk(S));drawItem()}
let lpX=0,lpY=0,lpTc=0,lpF=0;
function pop(h){const p=$('#pop');p.innerHTML='<div>'+h+'</div>';p.style.display='flex'}
function popX(){$('#pop').style.display='none'}
function lpA(id,n,k){const a=`'${id}',${n},'${k||''}'`;return `ontouchstart="lpS(event,${a})" ontouchmove="lpM(event)" ontouchend="lpE()" ontouchcancel="lpE()" onmousedown="lpS(event,${a})" onmouseup="lpE()" onmouseleave="lpE()" oncontextmenu="return false"`}
function lpS(e,id,n,k){if(e.type=='mousedown'&&Date.now()-lpTc<1200)return;let t=e;if(e.type=='touchstart'){lpTc=Date.now();t=e.touches[0]}lpX=t.clientX;lpY=t.clientY;e.stopPropagation();clearTimeout(lpT);lpT=setTimeout(()=>{lpF=1;lpAt=Date.now();k=='n'?noteAdd(id,n):ordAdd(id,n)},D.set.lp||550)}
function lpM(e){const t=e.touches[0];if(Math.abs(t.clientX-lpX)>10||Math.abs(t.clientY-lpY)>10)clearTimeout(lpT)}
function lpE(){clearTimeout(lpT);if(lpF){lpAt=Date.now();lpF=0}}
function ordAdd(id,n){const i=D.items.find(x=>x.id==id);if(!i||!i.rows[n])return;const r=i.rows[n];
 if(inOrd({iid:id,p:r.p}))return pop(`<b>${esc(i.name)} — ${esc(r.p)}</b><p class="m">আগে থেকেই অর্ডার তালিকায় আছে।</p><button onclick="popX()">ঠিক আছে</button>`);
 pop(`<b>${esc(i.name)} — ${esc(r.p)}</b><div class="r" style="margin-top:10px"><button class="p" onclick="ordOk('${id}',${n})">অর্ডার তালিকায় যোগ করুন</button><button class="s" onclick="popX()">বাতিল</button></div>`)}
function ordOk(id,n){const i=D.items.find(x=>x.id==id),r=i.rows[n];D.orders.push({id:uid(),iid:id,name:i.name,p:r.p,loc:r.loc,q:r.q,company:''});sv();pop('<b>অর্ডার তালিকায় যোগ হয়েছে ✓</b>');setTimeout(()=>{popX();render()},900)}
function noteAdd0(id){const i=D.items.find(x=>x.id==id);if(!i)return;pop(`<b>${esc(i.name)} — নোট</b><input id="nt" style="margin-top:8px" placeholder="নোট লিখুন"><div class="r" style="margin-top:10px"><button class="p" onclick="noteOk('${id}')">নোটে যোগ করুন</button><button class="s" onclick="popX()">বাতিল</button></div>`);setTimeout(()=>$('#nt').focus(),50)}
function noteOk0(id){const v=$('#nt').value.trim(),i=D.items.find(x=>x.id==id);if(v&&i){i.notes=i.notes||[];i.notes.push(v);sv()}popX()}
function notesH(){S.notes=S.notes||[];return S.notes.map((t,i)=>`<div class="r" style="margin-bottom:6px"><input value="${esc(t)}" oninput="S.notes[${i}]=this.value"><button class="x s" onclick="S.notes.splice(${i},1);$('#notes').innerHTML=notesH()">✕</button></div>`).join('')}
function drawView1(id){const i=D.items.find(x=>x.id==id);if(!i)return;const nt=i.notes||[];const st='ontouchstart="event.stopPropagation()" onmousedown="event.stopPropagation()"';
 openS(`<div class="r"><b>${esc(i.name)}</b><button class="s" onclick="editIt('${id}')">✎ সম্পাদনা</button><button class="s" onclick="closeS()">✕</button></div>${i.alias?`<div class="m">${esc(i.alias)}</div>`:''}<div class="m">ক্যাটাগরি: ${esc(i.cat)} · সর্বনিম্ন সীমা: ${i.min||0}</div>
<div class="card" style="margin-top:10px;padding:0"><div class="r m" style="padding:8px 12px"><span>পাওয়ার</span><span>কোথায়</span><span class="s" style="min-width:104px">পরিমাণ</span></div>${i.rows.map((r,n)=>`<div class="r ${rc(i,r)}" style="padding:8px 12px;border-top:1px solid var(--bd);user-select:none;-webkit-touch-callout:none" ${lpA(id,n)}><span>${esc(r.p)}</span><span>${esc(r.loc)||'—'}</span><span class="s r" style="min-width:104px;justify-content:space-between"><button ${st} onclick="qv(event,'${id}',${n},-1)">−</button><b>${r.q}</b><button ${st} onclick="qv(event,'${id}',${n},1)">+</button></span></div>`).join('')}</div>
<div class="card" style="margin-top:10px;padding:0"><div class="m" style="padding:8px 12px">নোট</div>${nt.length?nt.map(t=>`<div style="padding:10px 12px;border-top:1px solid var(--bd)">${esc(t)}</div>`).join(''):`<div class="m" style="padding:10px 12px;border-top:1px solid var(--bd)">কোনো নোট নেই। সম্পাদনায় গিয়ে যোগ করুন।</div>`}</div>
<p class="m">পাওয়ারে চেপে ধরলে অর্ডার তালিকায় যোগ করার অপশন আসবে।</p>`)}
function qv0(e,id,n,d){e.stopPropagation();const r=D.items.find(x=>x.id==id).rows[n];r.q=Math.max(0,r.q+d);sv();drawView(id)}
function shareO(copy){const L=D.orders.filter(o=>!sel.size||sel.has(o.id));const t=L.map((o,i)=>`${i+1}. ${o.name} ${o.p}`).join('\n');
 const fb=()=>pop(`<b>কপি করুন</b><textarea style="width:100%;height:150px;margin-top:8px">${esc(t)}</textarea>`);
 if(!copy&&navigator.share)navigator.share({text:t}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{pop('<b>কপি হয়েছে ✓</b>');setTimeout(popX,900)},fb);else fb()}
function done(id){const o=D.orders.find(x=>x.id==id);pop(`<b>${esc(o.name)} — ${esc(o.p)}</b><div class="lbl">কতটা এসেছে? (স্টকে যোগ হবে)</div><input id="dq" type="number" min="0" value="1"><div class="r" style="margin-top:10px"><button class="p" onclick="doneOk('${id}')">কমপ্লিট</button><button class="s" onclick="popX()">বাতিল</button></div>`)}
function doneOk(id){const o=D.orders.find(x=>x.id==id),n=+$('#dq').value||0,it=D.items.find(x=>x.id==o.iid),r=it&&(it.rows.find(x=>x.p==o.p&&x.loc==o.loc)||it.rows.find(x=>x.p==o.p));if(r)addQ(r,n);D.orders=D.orders.filter(x=>x.id!=id);sv();popX();render()}
function rowIdx(o){const i=D.items.find(x=>x.id==o.iid);if(!i)return 0;let n=i.rows.findIndex(r=>r.p==o.p&&r.loc==o.loc);if(n<0)n=i.rows.findIndex(r=>r.p==o.p);return Math.max(n,0)}
function noteAdd(id,n){const i=D.items.find(x=>x.id==id),r=i&&i.rows[n];if(!r)return;pop(`<b>${esc(i.name)} — ${esc(r.p)} — নোট</b>${r.note?`<div class="m" style="white-space:pre-wrap;margin-top:6px">${esc(r.note)}</div>`:''}<input id="nt" style="margin-top:8px" placeholder="নোট লিখুন"><div class="r" style="margin-top:10px"><button class="p" onclick="noteOk('${id}',${n})">নোটে যোগ করুন</button><button class="s" onclick="popX()">বাতিল</button></div>`);setTimeout(()=>$('#nt').focus(),50)}
function noteOk(id,n){const v=$('#nt').value.trim(),i=D.items.find(x=>x.id==id),r=i&&i.rows[n];if(v&&r){r.note=r.note?r.note+'\n'+v:v;sv()}popX()}
function rowsH1(){return S.rows.map((r,i)=>`<div style="margin-bottom:10px"><div class="r" style="margin-bottom:4px"><input id="p${i}" list="pl" placeholder="পাওয়ার" value="${esc(r.p)}" oninput="S.rows[${i}].p=this.value;lastPot=this.value" onkeydown="k(event,'p',${i})"><input id="l${i}" placeholder="কোথায়" value="${esc(r.loc)}" oninput="S.rows[${i}].loc=this.value" onkeydown="k(event,'l',${i})"><input type="number" min="0" style="max-width:62px;flex:none" value="${r.q}" oninput="S.rows[${i}].q=+this.value"><button class="x s" onclick="S.rows.splice(${i},1);$('#rows').innerHTML=rowsH()">✕</button></div><input placeholder="নোট (এই পাওয়ারের জন্য)" value="${esc(r.note||'')}" oninput="S.rows[${i}].note=this.value"></div>`).join('')}

function lastNum(t){const m=[...String(t).matchAll(/[0-9\u09e6-\u09ef]+(?:\.[0-9\u09e6-\u09ef]+)?/g)];return m.length?m[m.length-1]:null}
function toEn(s){return s.replace(/[\u09e6-\u09ef]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x09e6+48))}
function pn(t,old){const m=lastNum(t);return m?parseFloat(toEn(m[0])):old}
function addQ(r,d){let t=(r.qt!=null&&r.qt!=='')?String(r.qt):String(r.q);const m=lastNum(t);
 if(!m)t=t+' '+Math.max(0,d);
 else{const bn=/[\u09e6-\u09ef]/.test(m[0]);const v=Math.max(0,parseFloat(toEn(m[0]))+d);let s=Number.isInteger(v)?String(v):v.toFixed(1);if(bn)s=s.replace(/[0-9]/g,c=>String.fromCharCode(c.charCodeAt(0)-48+0x09e6));t=t.slice(0,m.index)+s+t.slice(m.index+m[0].length)}
 r.qt=t;r.q=pn(t,r.q)}

function outRows(){const o=[];D.items.forEach(i=>i.rows.forEach(r=>{if(r.q<=(i.min||0))o.push({iid:i.id,name:i.name,p:r.p,loc:r.loc,q:r.q})}));return o}
const inOrd=(x)=>D.orders.some(o=>o.iid==x.iid&&o.p==x.p);
function vStock(){const L=outRows();return `<p class="m">স্টকে নেই বা কম: ${L.length}টি</p>`+(L.length?`<button class="p" onclick="addAll()" style="margin-bottom:10px">সব অর্ডারে যোগ করুন</button>`:'<p>সব স্টকে আছে ✓</p>')+L.map((x,n)=>`<div class="card r"><span onclick="openItem('${x.iid}')"><b>${esc(x.name)}</b><span class="m">${esc(x.p)}${x.loc?' · '+esc(x.loc):''} · ${x.q<=0?'স্টকে নেই':'কম আছে ('+x.q+')'}</span></span>${inOrd(x)?'<span class="m s">যোগ হয়েছে</span>':`<button class="s" onclick="addOrd(${n})">অর্ডারে যোগ</button>`}</div>`).join('')}
function stock(){go('stock')}
function addOrd(n){const x=outRows()[n];if(!inOrd(x)){D.orders.push({id:uid(),...x,company:''});sv()}render()}
function addAll(){outRows().forEach(x=>{if(!inOrd(x))D.orders.push({id:uid(),...x,company:''})});sv();render()}

function vOrders(){return (D.orders.length?`<div class="r" style="margin-bottom:10px"><button onclick="shareO(1)">কপি</button><button onclick="shareO()">শেয়ার (${sel.size||'সব'})</button></div>`:'')+
 (D.orders.length?D.orders.map(o=>`<div class="card"><div class="r"><input type="checkbox" class="s" style="width:20px" ${sel.has(o.id)?'checked':''} onchange="this.checked?sel.add('${o.id}'):sel.delete('${o.id}')"><span onclick="openItem('${o.iid}')" style="user-select:none;-webkit-touch-callout:none" ${lpA(o.iid,rowIdx(o),'n')}><b>${esc(o.name)}</b><span class="m">${esc(o.p)}${o.loc?' · '+esc(o.loc):''}</span></span><button class="s" onclick="done('${o.id}')">✓ কমপ্লিট</button></div>
<input style="margin-top:8px" list="cl" placeholder="কোন কোম্পানিকে অর্ডার দেওয়া হয়েছে" value="${esc(o.company)}" onchange="setCo('${o.id}',this.value)"></div>`).join(''):'<p class="m">অর্ডার লিস্ট খালি। "স্টক চেক" থেকে যোগ করুন।</p>')}
function shareO0(){const L=D.orders.filter(o=>!sel.size||sel.has(o.id));const t=L.map((o,i)=>`${i+1}. ${o.name} ${o.p}${o.company?' ('+o.company+')':''}`).join('\n');
 navigator.share?navigator.share({text:t}).catch(()=>{}):(navigator.clipboard&&navigator.clipboard.writeText(t),alert('কপি হয়েছে'))}

function vAcct(){const L=D[tab];return `<div class="tabs"><button class="${tab=='debt'?'on':''}" onclick="tab='debt';render()">দেনা</button><button class="${tab=='recv'?'on':''}" onclick="tab='recv';render()">পাওনা</button></div>`+
 (L.length?L.map(a=>{const p=a.pays.reduce((s,x)=>s+x.a,0);return `<div class="card" onclick="openAcct('${a.id}')"><b>${esc(a.name)}</b><span class="m">মোট ${a.total} · পরিশোধ ${p}</span><br><span class="${a.total-p>0?'out':''}">বাকি ${a.total-p}</span>${a.deadline?`<span class="${dl(a,p)?'out':'m'}"> · ডেডলাইন ${esc(a.deadline)}${dl(a,p)}</span>`:''}</div>`}).join(''):'<p class="m">কিছু নেই। নিচের + চেপে যোগ করুন।</p>')}
function openAcct(id){const a=id&&D[tab].find(x=>x.id==id);A=a?JSON.parse(JSON.stringify(a)):{name:'',total:0,bank:'',deadline:'',pays:[]};A.id=id;A.t=tab;drawAcct()}
function drawAcct(){const p=A.pays.reduce((s,x)=>s+x.a,0);openS(`<div class="r"><b class="s">${A.t=='debt'?'দেনা':'পাওনা'}</b><span></span><button class="s" onclick="closeS()">✕</button></div>
<div class="lbl">নাম</div><input value="${esc(A.name)}" oninput="A.name=this.value">
<div class="lbl">মোট টাকা</div><input type="number" value="${A.total}" oninput="A.total=+this.value">
<div class="lbl">ব্যাংক নম্বর</div><input value="${esc(A.bank)}" oninput="A.bank=this.value">
<div class="lbl">ডেডলাইন</div><input type="date" value="${esc(A.deadline)}" oninput="A.deadline=this.value">
<div class="lbl">পরিশোধ (বাকি ${A.total-p})</div>${A.pays.map((x,i)=>`<div class="r" style="margin-bottom:5px"><span>${esc(x.d)}</span><span>${x.a}</span><button class="x s" onclick="A.pays.splice(${i},1);drawAcct()">✕</button></div>`).join('')}
<div class="r"><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="pa" type="number" placeholder="টাকা"><button class="s" onclick="addPay()">যোগ</button></div>
<div class="r" style="margin-top:12px"><button class="p" onclick="saveAcct()">সেভ</button>${A.id?'<button class="x" onclick="delAcct()">মুছুন</button>':''}</div>`)}
function addPay(){const a=+$('#pa').value;if(!a)return;A.pays.push({d:$('#pd').value,a});drawAcct()}
function saveAcct(){if(!A.name.trim())return alert('নাম লিখুন');const L=D[A.t],o={id:A.id||uid(),name:A.name.trim(),total:A.total,bank:A.bank,deadline:A.deadline,pays:A.pays};
 const k2=L.findIndex(x=>x.id==o.id);k2<0?L.push(o):L[k2]=o;sv();closeS()}
function delAcct(){if(confirm('মুছে ফেলবেন?')){D[A.t]=D[A.t].filter(x=>x.id!=A.id);sv();closeS()}}

function vSet0(){return `<div class="card"><div class="lbl">থিম</div><select onchange="D.set.theme=this.value;sv();render()">${[['auto','অটো'],['light','লাইট'],['dark','ডার্ক']].map(([v,t])=>`<option value="${v}" ${D.set.theme==v?'selected':''}>${t}</option>`).join('')}</select>
<div class="lbl">লেখার সাইজ (${D.set.fs}px)</div><input type="range" min="13" max="24" value="${D.set.fs}" oninput="D.set.fs=+this.value;sv();applySet()">
<div class="lbl">লেখার রঙ</div><div class="r"><input type="color" value="${D.set.color||'#1d2b24'}" onchange="D.set.color=this.value;sv();applySet()"><button onclick="D.set.color='';sv();render()">ডিফল্ট</button></div></div>
<div class="card"><b>ক্যাটাগরির ক্রম</b>${D.cats.map((c,i)=>`<div class="r" style="margin-top:6px"><span>${esc(c)}</span><button class="s" onclick="mv(${i},-1)">↑</button><button class="s" onclick="mv(${i},1)">↓</button><button class="x s" onclick="rmCat(${i})">✕</button></div>`).join('')}</div>
<div class="card"><b>ডেভেলপার / ব্যাকআপ</b><div class="r" style="margin-top:8px"><button onclick="exp()">ব্যাকআপ কপি</button><button onclick="imp()">রিস্টোর</button></div><div class="r" style="margin-top:8px"><button onclick="bkNow()">এখনই অটো-ব্যাকআপ নিন</button><button onclick="bkRest()">অটো-ব্যাকআপ থেকে ফেরত</button></div><p class="m">প্রতি সপ্তাহে নিজে থেকে ব্যাকআপ হয়। শেষ ব্যাকআপ: ${bkInfo()}<br>গুগল ড্রাইভ ব্যাকআপ নেটিভ এপে যুক্ত হবে।</p></div>`}
function mv(i,d){const j=i+d;if(j<0||j>=D.cats.length)return;[D.cats[i],D.cats[j]]=[D.cats[j],D.cats[i]];sv();render()}
function rmCat(i){if(D.cats.length>1&&confirm('ক্যাটাগরি মুছবেন? এর ঔষধগুলো থাকবে।')){D.cats.splice(i,1);sv();render()}}
function exp(){const t=JSON.stringify(D);navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert('ব্যাকআপ কপি হয়েছে')):prompt('কপি করুন',t)}
function imp(){const t=prompt('ব্যাকআপ টেক্সট পেস্ট করুন');if(!t)return;try{D=JSON.parse(t);sv();cat=D.cats[0];render()}catch(e){alert('ভুল ডেটা')}}
try{const b=JSON.parse(localStorage.getItem('ms1bk')||'null');if(D.set.ab!==false&&(!b||Date.now()-b.t>6048e5))localStorage.setItem('ms1bk',JSON.stringify({t:Date.now(),d:D}))}catch(e){}
$('#sb').addEventListener('input',()=>{clearTimeout(adT);adT=setTimeout(saveDraft,300)});
addEventListener('pagehide',saveDraft);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDraft()});
if(D.seeded&&!D.seeded2)seedAbb();
if(D.seeded&&!D.seeded3)mergeAll();
if(D.set.dp)lastPot=D.set.dp;
if(!D.seeded)seed();
render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
