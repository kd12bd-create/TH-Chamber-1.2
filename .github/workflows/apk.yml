name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          echo '{"appId":"com.thchamber.app","appName":"TH Chamber","webDir":"www"}' > capacitor.config.json
      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Add Android and build
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TH-Chamber-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
